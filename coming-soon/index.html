<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Morning Box · Coming soon</title>
  <meta name="description" content="Morning Box, your personal breakfast assistant. Personalised breakfasts, prepared fresh by partner bakeries and delivered to your office in DIFC. Coming soon.">
  <meta name="theme-color" content="#FBF7EF">
  <meta property="og:title" content="Morning Box · Coming soon">
  <meta property="og:description" content="Your next breakfast, already sorted. Launching soon in DIFC, Dubai.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="/icons/morning-box-192.png">
  <link rel="apple-touch-icon" href="/icons/morning-box-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Morning Box brand tokens (same values as the app, src/styles.css). */
    :root {
      --gold: #D99A12; --muted-gold: #B98524; --label: #8A6416;
      --espresso: #3B2D22; --ivory: #FBF7EF; --line: #E6DAC6;
      --text-2: #5E4E3F; --text-3: #75655A;
      --serif: "DM Serif Display", Georgia, "Times New Roman", serif;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--ivory); color: var(--espresso);
      font-family: var(--sans); font-size: 16px; line-height: 1.5;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 0 20px;
    }
    .page { width: 100%; max-width: 760px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 0 calc(48px + env(safe-area-inset-bottom)); }

    /* The approved logo, cropped to its mark with clear space (as in the app's <Logo>), never redrawn. */
    .logo { --w: 230px; display: block; width: var(--w); height: calc(var(--w) * 575 / 1140); overflow: hidden; }
    .logo img { display: block; max-width: none; mix-blend-mode: darken;
      width: calc(var(--w) * 1536 / 1140); margin-left: calc(var(--w) * -165 / 1140); margin-top: calc(var(--w) * -230 / 1140); }

    .eyebrow { margin: 52px 0 0; font-size: 13px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--label); padding-left: .32em; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(42px, 8.5vw, 72px); line-height: 1.08; letter-spacing: -.01em; margin: 22px 0 0; text-wrap: balance; }
    h1 em { font-style: italic; color: var(--muted-gold); }
    .rule { width: 72px; height: 2px; border: 0; background: var(--gold); margin: 40px auto 0; }
    .lede { margin: 34px 0 0; font-size: 18px; color: var(--text-2); max-width: 32em; text-wrap: pretty; }
    .lede a { color: var(--espresso); font-weight: 600; text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 5px; }
    .lede a:hover, .lede a:focus-visible { color: var(--label); }


    @media (max-width: 480px) {
      .logo { --w: 190px; }
      .eyebrow { margin-top: 40px; font-size: 12px; }
      .rule { margin-top: 32px; }
      .lede { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="logo"><img src="/assets/morningbox-logo.png" alt="Morning Box"></span>
    <p class="eyebrow">Coming soon</p>
    <h1>Your next breakfast, <em>already sorted.</em></h1>
    <hr class="rule">
    <p class="lede">Personalised breakfasts, prepared fresh by partner bakeries and delivered to your office in DIFC. Our website is launching soon. Until then, write to us at <a href="mailto:info@morningbox.ae">info@morningbox.ae</a>.</p>
  </main>
  <script>
    /* Visitors who opened the app here before have its offline cache installed: remove it so they see this page. */
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('morning-box-')).forEach(k => caches.delete(k))).catch(() => {});
  </script>
</body>
</html>
